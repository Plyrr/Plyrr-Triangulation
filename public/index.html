<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triangulación en Vivo</title>
<style>
/* ... (Pega aquí exactamente el mismo CSS <style> de la respuesta anterior) ... */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{ --bg: #131211; --bg-soft: #1a1917; --panel: #26241f; --panel-hi: #3a372f; --bevel-light: #4c4838; --bevel-dark: #0d0c0a; --text: #eae7dc; --text-dim: #9a968a; --grid-line: #2c2a25; --grid-line-strong: #3d3a33; --green: #7fd83f; --blue: #4bc3f0; --gold: #f0c419; --red: #ff6b6b; --purple: #c084f5; }
*{ box-sizing: border-box; }
body{ margin:0; background: var(--bg); background-image: radial-gradient(circle at 20% 10%, rgba(127,216,63,0.04), transparent 40%), radial-gradient(circle at 80% 90%, rgba(75,195,240,0.04), transparent 40%); color: var(--text); font-family: 'JetBrains Mono', monospace; line-height: 1.5; padding: 32px 16px 60px; }
.wrap{ max-width: 980px; margin: 0 auto; }
header h1{ font-family: 'Press Start 2P', monospace; font-size: 20px; line-height: 1.6; color: var(--green); text-shadow: 3px 3px 0 #0d0c0a; margin: 0 0 14px; }
header p.subtitle{ color: var(--text-dim); max-width: 58ch; margin: 0 0 20px; font-size: 14px; }
.quick-paste { margin-bottom: 24px; }
.quick-paste input { width: 100%; background: rgba(127, 216, 63, 0.05); border: 1px dashed var(--green); color: var(--green); padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; box-shadow: inset -2px -2px 0 var(--bevel-dark); text-align: center; transition: all 0.2s; }
.quick-paste input:focus { outline: none; background: var(--panel-hi); border-color: var(--text); color: var(--text); }
.quick-paste input::placeholder { color: var(--green); opacity: 0.7; }
.players{ display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
.player-card{ background: var(--panel); box-shadow: inset -2px -2px 0 var(--bevel-dark), inset 2px 2px 0 var(--bevel-light); padding: 14px 14px 16px; position: relative; }
.card-head{ display:flex; align-items:center; gap:8px; margin-bottom: 12px; }
.dot{ width: 12px; height: 12px; background: var(--accent); box-shadow: inset -1px -1px 0 rgba(0,0,0,0.4), inset 1px 1px 0 rgba(255,255,255,0.5); flex-shrink: 0; }
.card-head .name{ font-weight: 600; font-size: 13px; color: var(--text); }
.remove{ margin-left: auto; background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 6px; }
.remove:hover{ color: var(--red); }
.player-card label{ display: block; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
.player-card input{ width: 100%; margin-top: 4px; background: var(--bg-soft); border: none; box-shadow: inset -1px -1px 0 var(--bevel-light), inset 1px 1px 0 var(--bevel-dark); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 8px; }
.player-card input:focus{ outline: 1px solid var(--accent); }
.warn-tag{ margin-top: 10px; font-size: 10.5px; color: var(--gold); }
.btn{ background: #7a776c; box-shadow: inset -2px -2px 0 var(--bevel-dark), inset 2px 2px 0 #96927f; color: #fff; text-shadow: 1px 1px 0 #201f1c; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; padding: 10px 18px; cursor: pointer; }
.btn:hover{ background: #8b8877; }
.btn:active{ filter: brightness(0.92); }
.result-area{ margin-top: 28px; display: grid; grid-template-columns: minmax(260px, 1fr) minmax(220px, 320px); gap: 18px; align-items: start; }
@media (max-width: 720px){ .result-area{ grid-template-columns: 1fr; } }
.map-panel{ background: var(--bg-soft); box-shadow: inset -2px -2px 0 var(--bevel-dark), inset 2px 2px 0 var(--bevel-light); padding: 10px; }
canvas{ display: block; width: 100%; height: auto; background: #0e0d0b; }
.result-panel{ background: var(--panel); box-shadow: inset -2px -2px 0 var(--bevel-dark), inset 2px 2px 0 var(--bevel-light); padding: 18px; }
.result-panel .label{ font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.result-panel .coords{ font-size: 19px; font-weight: 700; color: var(--green); margin-bottom: 18px; word-break: break-word; }
.result-panel .metric{ font-size: 12.5px; color: var(--text-dim); margin-bottom: 4px; }
.result-panel .metric b{ color: var(--text); }
.warnings{ margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--grid-line-strong); }
.warnings p{ font-size: 11.5px; color: var(--gold); margin: 0 0 8px; }
.warnings p.error{ color: var(--red); }
footer.help{ margin-top: 30px; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--grid-line-strong); padding-top: 16px; }
footer.help code{ background: var(--bg-soft); padding: 1px 5px; color: var(--blue); }
</style>
<!-- IMPORTAMOS SOCKET.IO AL FRONTEND -->
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TRIANGULACIÓN EN VIVO 🟢</h1>
    <p class="subtitle">Todo lo que pegues o cambies aquí se actualizará al instante para tus amigos.</p>
  </header>

  <div class="quick-paste">
    <input type="text" id="pasteInput" placeholder="> Mirá al objetivo en el juego, pulsa F3+C, y pega (Ctrl+V) el comando aquí <" autocomplete="off">
  </div>

  <section class="players" id="players"></section>

  <button class="btn" id="addPlayer">+ Añadir jugador manual</button>
  <button class="btn" id="resetBtn" style="margin-left: 10px; background: #ff6b6b;">Resetear Todo</button>

  <section class="result-area">
    <div class="map-panel">
      <canvas id="mapCanvas"></canvas>
    </div>
    <div class="result-panel" id="resultPanel"></div>
  </section>

</div>

<script>
const socket = io(); // Conectar al servidor en tiempo real

const COLORS = ['#7fd83f', '#4bc3f0', '#f0c419', '#ff6b6b', '#c084f5'];
let players = [];
let nextId = 2;

const playersEl = document.getElementById('players');
const resultEl = document.getElementById('resultPanel');
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const pasteInput = document.getElementById('pasteInput');

// ==========================================
// LÓGICA DE TIEMPO REAL (RECEPCIÓN)
// ==========================================
socket.on('sync-data', (data) => {
  players = data;
  if(players.length > 0) {
    nextId = Math.max(...players.map(p => p.id)) + 1;
  }
  renderPlayers();
  computeAndRender();
});

// Función para enviar nuestros cambios al resto
function emitChanges() {
  socket.emit('update-data', players);
  renderPlayers();
  computeAndRender();
}

// ==========================================
// EVENTOS LOCALES (PEGADO, ESCRITURA, CLICKS)
// ==========================================

pasteInput.addEventListener('paste', (e) => {
  setTimeout(() => {
    const val = pasteInput.value;
    pasteInput.value = ''; 
    const nums = val.match(/-?\d+\.?\d*/g);
    
    if (nums && nums.length >= 5) {
      const x = parseFloat(nums[0]);
      const z = parseFloat(nums[2]);
      const yaw = parseFloat(nums[3]);
      
      let targetPlayer = players.find(p => p.x === null && p.z === null && p.yaw === null);
      
      if (targetPlayer) {
        targetPlayer.x = x; targetPlayer.z = z; targetPlayer.yaw = yaw;
      } else {
        if (players.length < 5) {
          players.push({ id: nextId++, x, z, yaw });
        } else {
          alert("Ya alcanzaron el máximo de 5 jugadores.");
          return;
        }
      }
      
      emitChanges(); // <--- ENVIAMOS EL CAMBIO AL SERVIDOR
      pasteInput.placeholder = "¡Recibido! Compartido con todos.";
      setTimeout(() => pasteInput.placeholder = "> Mirá al objetivo en el juego, pulsa F3+C, y pega (Ctrl+V) el comando aquí <", 2000);
    } else {
      alert("Formato no reconocido. Usa F3+C.");
    }
  }, 10);
});

playersEl.addEventListener('input', (e) => {
  const card = e.target.closest('.player-card');
  if (!card) return;
  const id = Number(card.dataset.id);
  const p = players.find(pl => pl.id === id);
  if (!p) return;
  
  if (e.target.classList.contains('inp-x')) p.x = e.target.value === '' ? null : parseFloat(e.target.value);
  if (e.target.classList.contains('inp-z')) p.z = e.target.value === '' ? null : parseFloat(e.target.value);
  if (e.target.classList.contains('inp-yaw')) p.yaw = e.target.value === '' ? null : parseFloat(e.target.value);
  
  emitChanges(); // <--- ENVIAMOS EL CAMBIO AL ESCRIBIR
});

playersEl.addEventListener('click', (e) => {
  if (!e.target.classList.contains('remove')) return;
  const card = e.target.closest('.player-card');
  const id = Number(card.dataset.id);
  players = players.filter(p => p.id !== id);
  emitChanges(); // <--- ENVIAMOS EL CAMBIO AL BORRAR JUGADOR
});

document.getElementById('addPlayer').addEventListener('click', () => {
  if (players.length >= 5) return;
  const valid = players.filter(p => p.x !== null);
  const avgX = valid.length ? valid.reduce((s, p) => s + p.x, 0) / valid.length : 0;
  const avgZ = valid.length ? valid.reduce((s, p) => s + p.z, 0) / valid.length : 0;
  players.push({ id: nextId++, x: Math.round(avgX), z: Math.round(avgZ), yaw: 0 });
  emitChanges();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  players = [{ id: 1, x: null, z: null, yaw: null }];
  nextId = 2;
  emitChanges();
});

// Funciones de renderizado (Matemáticas, mapa y tarjetas - Mismas de antes)
function renderPlayers(){
  playersEl.innerHTML = '';
  players.forEach((p, i) => {
    const color = COLORS[i % COLORS.length];
    const card = document.createElement('div');
    card.className = 'player-card';
    card.dataset.id = p.id;
    card.style.setProperty('--accent', color);
    card.innerHTML = `
      <div class="card-head">
        <span class="dot"></span>
        <span class="name">Jugador ${i + 1}</span>
        ${players.length > 1 ? '<button class="remove" title="Quitar">×</button>' : ''}
      </div>
      <label>X
        <input type="number" step="0.1" class="inp-x" value="${p.x !== null ? p.x : ''}">
      </label>
      <label>Z
        <input type="number" step="0.1" class="inp-z" value="${p.z !== null ? p.z : ''}">
      </label>
      <label>Yaw
        <input type="number" step="0.1" class="inp-yaw" value="${p.yaw !== null ? p.yaw : ''}">
      </label>
      <div class="warn-tag" data-role="warn"></div>
    `;
    playersEl.appendChild(card);
  });
}

function yawToDir(yawDeg){ const r = yawDeg * Math.PI / 180; return { dx: -Math.sin(r), dz: Math.cos(r) }; }

function computeIntersection(valid){
  let a00 = 0, a01 = 0, a11 = 0, b0 = 0, b1 = 0;
  valid.forEach(p => {
    const { dx, dz } = yawToDir(p.yaw);
    const m00 = 1 - dx * dx; const m01 = -dx * dz; const m11 = 1 - dz * dz;
    a00 += m00; a01 += m01; a11 += m11;
    b0 += m00 * p.x + m01 * p.z; b1 += m01 * p.x + m11 * p.z;
  });
  const det = a00 * a11 - a01 * a01;
  if (Math.abs(det) < 1e-9) return null;
  return { x: (b0 * a11 - a01 * b1) / det, z: (a00 * b1 - b0 * a01) / det };
}

function niceStep(range, target){
  if (range <= 0) return 10;
  const rough = range / target;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1; else if (norm < 3) step = 2; else if (norm < 7) step = 5; else step = 10;
  return step * mag;
}

function computeAndRender(){
  const valid = players.filter(p => p.x !== null && p.z !== null && p.yaw !== null && Number.isFinite(p.x) && Number.isFinite(p.z) && Number.isFinite(p.yaw));
  document.querySelectorAll('[data-role="warn"]').forEach(el => el.textContent = '');

  if (valid.length < 2){
    resultEl.innerHTML = `<p class="metric">Esperando datos. Que alguien más pegue su F3+C.</p>`;
    drawMap(valid, null);
    return;
  }

  const target = computeIntersection(valid);
  if (!target){
    resultEl.innerHTML = `<div class="warnings"><p class="error">Líneas paralelas.</p></div>`;
    drawMap(valid, null); return;
  }

  let residual = 0;
  valid.forEach(p => {
    const { dx, dz } = yawToDir(p.yaw);
    residual += Math.abs((target.x - p.x) * dz - (target.z - p.z) * dx);
  });
  residual /= valid.length;

  resultEl.innerHTML = `
    <div class="label">Objetivo estimado</div>
    <div class="coords">X: ${target.x.toFixed(1)} &nbsp; Z: ${target.z.toFixed(1)}</div>
    <div class="metric">Jugadores listos: <b>${valid.length}</b></div>
    ${valid.length > 2 ? `<div class="metric">Margen de error: <b>±${residual.toFixed(1)} bloques</b></div>` : ''}
  `;
  drawMap(valid, target);
}

function drawMap(valid, target){
  const container = canvas.parentElement;
  const size = Math.min(container.clientWidth - 20, 560);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, size, size);
  if (valid.length === 0) return;

  const xs = valid.map(p => p.x), zs = valid.map(p => p.z);
  if (target){ xs.push(target.x); zs.push(target.z); }
  let minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
  let rangeX = maxX - minX || 20, rangeZ = maxZ - minZ || 20;
  const padX = Math.max(rangeX * 0.4, 15), padZ = Math.max(rangeZ * 0.4, 15);
  minX -= padX; maxX += padX; minZ -= padZ; maxZ += padZ;
  rangeX = maxX - minX; rangeZ = maxZ - minZ;

  const scale = Math.min(size / rangeX, size / rangeZ);
  const offX = (size - rangeX * scale) / 2, offY = (size - rangeZ * scale) / 2;
  function toScreen(x, z){ return [offX + (x - minX) * scale, offY + (maxZ - z) * scale]; }

  ctx.font = '10px "JetBrains Mono", monospace'; ctx.fillStyle = '#6b675c'; ctx.strokeStyle = '#2c2a25'; ctx.lineWidth = 1;
  const step = niceStep(Math.max(rangeX, rangeZ), 8);
  for (let gx = Math.ceil(minX / step) * step; gx <= maxX; gx += step){
    const [sx] = toScreen(gx, 0); ctx.beginPath(); ctx.moveTo(sx, offY); ctx.lineTo(sx, offY + rangeZ * scale); ctx.stroke(); ctx.fillText(gx.toFixed(0), sx + 3, size - 4);
  }
  for (let gz = Math.ceil(minZ / step) * step; gz <= maxZ; gz += step){
    const [, sy] = toScreen(0, gz); ctx.beginPath(); ctx.moveTo(offX, sy); ctx.lineTo(offX + rangeX * scale, sy); ctx.stroke(); ctx.fillText(gz.toFixed(0), 3, sy - 3);
  }

  const diag = Math.sqrt(rangeX * rangeX + rangeZ * rangeZ);
  valid.forEach((p) => {
    const idx = players.indexOf(p); const color = COLORS[idx % COLORS.length];
    const { dx, dz } = yawToDir(p.yaw);
    const [sx, sy] = toScreen(p.x, p.z), [ex, ey] = toScreen(p.x + dx * diag, p.z + dz * diag);
    ctx.strokeStyle = color; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = color; ctx.fillRect(sx - 4, sy - 4, 8, 8); ctx.fillStyle = '#eae7dc'; ctx.fillText('J' + (idx + 1), sx + 7, sy - 6);
  });

  if (target){
    const [tx, ty] = toScreen(target.x, target.z);
    ctx.strokeStyle = '#eae7dc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tx - 8, ty); ctx.lineTo(tx + 8, ty); ctx.moveTo(tx, ty - 8); ctx.lineTo(tx, ty + 8); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx, ty, 11, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(234,231,220,0.4)'; ctx.lineWidth = 1; ctx.stroke();
  }
}

window.addEventListener('resize', computeAndRender);
</script>
</body>
</html>
